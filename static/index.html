<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bluetooth Scanner</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6.5 6.5l11 11L12 21V3l5.5 5.5-11 11"/>
          </svg>
        </div>
        <div>
          <h1>Bluetooth Scanner</h1>
          <p class="subtitle">BLE &amp; Classic — Arduino, ESP32, HC-05, and more</p>
        </div>
      </div>
      <div class="header-right">
        <div class="adapter-status" id="adapterStatus">
          <span class="status-dot offline"></span>
          <span>Checking adapter…</span>
        </div>
      </div>
    </header>

    <section class="toolbar">
      <button class="btn btn-primary" id="scanBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        Scan Devices
      </button>
      <button class="btn btn-secondary" id="clearBtn">Clear</button>
      <div class="filter-group">
        <label>Filter</label>
        <select id="typeFilter">
          <option value="all">All types</option>
          <option value="ble">BLE only</option>
          <option value="classic">Classic only</option>
          <option value="paired">Paired only</option>
          <option value="maker">Maker boards</option>
        </select>
      </div>
      <div class="search-group">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="search" id="searchInput" placeholder="Search name or address…" />
      </div>
      <div class="stats" id="stats">
        <span id="deviceCount">0 devices</span>
      </div>
    </section>

    <div class="scan-banner hidden" id="scanBanner">
      <div class="spinner"></div>
      <span>Scanning for Bluetooth devices…</span>
    </div>

    <main class="device-grid" id="deviceGrid">
      <div class="empty-state" id="emptyState">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4">
          <path d="M6.5 6.5l11 11L12 21V3l5.5 5.5-11 11"/>
        </svg>
        <h2>No devices yet</h2>
        <p>Click <strong>Scan Devices</strong> to discover nearby Bluetooth devices including Arduino boards, ESP32, HC-05 modules, and more.</p>
      </div>
    </main>
  </div>

  <div class="modal hidden" id="deviceModal">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-content">
      <button class="modal-close" id="modalClose">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
